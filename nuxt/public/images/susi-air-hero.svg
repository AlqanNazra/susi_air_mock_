<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="Regional aircraft on an apron beneath a blue sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a4f7a"/>
      <stop offset="0.55" stop-color="#2f7bb0"/>
      <stop offset="1" stop-color="#8fc3e0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6670"/>
      <stop offset="1" stop-color="#3c444d"/>
    </linearGradient>
    <linearGradient id="mountainA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5a7d"/>
      <stop offset="1" stop-color="#3f6f92"/>
    </linearGradient>
    <linearGradient id="mountainB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e4560"/>
      <stop offset="1" stop-color="#35617f"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2138" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E2138" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="1200" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="1230" cy="230" r="150" fill="#ffffff" opacity="0.12"/>
  <circle cx="1230" cy="230" r="90" fill="#ffffff" opacity="0.14"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <g opacity="0.9">
      <ellipse cx="240" cy="240" rx="120" ry="42"/>
      <ellipse cx="320" cy="215" rx="90" ry="46"/>
      <ellipse cx="380" cy="245" rx="110" ry="36"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="1120" cy="150" rx="140" ry="40"/>
      <ellipse cx="1200" cy="130" rx="95" ry="44"/>
    </g>
    <g opacity="0.55">
      <ellipse cx="760" cy="330" rx="160" ry="30"/>
      <ellipse cx="850" cy="318" rx="100" ry="32"/>
    </g>
  </g>

  <!-- Distant mountains -->
  <path d="M0 640 L180 470 L330 600 L470 500 L640 660 L800 560 L980 690 L1180 520 L1360 660 L1600 540 L1600 780 L0 780 Z" fill="url(#mountainA)"/>
  <path d="M0 720 L220 600 L420 700 L640 610 L880 740 L1120 640 L1360 740 L1600 660 L1600 820 L0 820 Z" fill="url(#mountainB)"/>

  <!-- Tree line / treeline silhouette -->
  <g fill="#1c4257" opacity="0.9">
    <rect y="770" width="1600" height="30"/>
  </g>

  <!-- Apron / runway ground -->
  <rect y="800" width="1600" height="400" fill="url(#ground)"/>

  <!-- Runway markings -->
  <g fill="#dfe4e8" opacity="0.5">
    <rect x="0" y="905" width="1600" height="6"/>
  </g>
  <g fill="#eef2f5" opacity="0.55">
    <rect x="120" y="955" width="120" height="10" rx="3"/>
    <rect x="320" y="955" width="120" height="10" rx="3"/>
    <rect x="520" y="955" width="120" height="10" rx="3"/>
    <rect x="720" y="955" width="120" height="10" rx="3"/>
    <rect x="920" y="955" width="120" height="10" rx="3"/>
    <rect x="1120" y="955" width="120" height="10" rx="3"/>
    <rect x="1320" y="955" width="120" height="10" rx="3"/>
  </g>

  <!-- Aircraft shadow -->
  <ellipse cx="800" cy="872" rx="300" ry="26" fill="#000000" opacity="0.22"/>

  <!-- Regional turboprop aircraft (side view, facing left) -->
  <g transform="translate(560 660)">
    <!-- Fuselage -->
    <path d="M40 120 C30 96 60 78 120 72 L360 60 C410 57 452 66 476 84 L520 110 C528 120 524 132 512 138 L200 150 C120 154 60 146 40 120 Z" fill="#f5f7f9"/>
    <!-- Navy belly stripe -->
    <path d="M60 132 C120 146 300 148 500 136 L512 138 C520 144 512 150 500 152 L190 162 C110 160 66 150 60 132 Z" fill="#0E2138"/>
    <!-- Red accent stripe -->
    <path d="M120 92 C220 86 360 80 470 90 L470 100 C360 92 220 98 122 104 Z" fill="#E63757"/>
    <!-- Nose cone -->
    <path d="M40 120 C30 104 52 82 118 74 L120 150 C58 148 50 138 40 120 Z" fill="#e6eaee"/>
    <!-- Cockpit windows -->
    <path d="M70 92 C86 86 104 82 120 80 L118 96 C100 98 84 100 72 104 Z" fill="#16324f"/>
    <!-- Cabin windows -->
    <g fill="#16324f">
      <rect x="180" y="92" width="26" height="16" rx="5"/>
      <rect x="222" y="90" width="26" height="16" rx="5"/>
      <rect x="264" y="89" width="26" height="16" rx="5"/>
      <rect x="306" y="88" width="26" height="16" rx="5"/>
      <rect x="348" y="87" width="26" height="16" rx="5"/>
    </g>
    <!-- High wing -->
    <path d="M210 78 L520 52 L528 66 L214 92 Z" fill="#dfe4e8"/>
    <path d="M210 78 L520 52 L524 58 L214 84 Z" fill="#f5f7f9"/>
    <!-- Wing strut -->
    <rect x="300" y="90" width="10" height="40" fill="#c7ccd1"/>
    <!-- Engine nacelle on wing -->
    <path d="M300 66 C300 54 316 52 322 54 L326 92 C320 96 302 96 300 90 Z" fill="#e6eaee"/>
    <!-- Propeller -->
    <g transform="translate(312 74)">
      <ellipse cx="0" cy="0" rx="6" ry="54" fill="#2b333b" opacity="0.55"/>
      <circle cx="0" cy="0" r="7" fill="#3c444d"/>
    </g>
    <!-- Tail fin -->
    <path d="M468 62 L520 6 L552 8 L534 66 Z" fill="#E63757"/>
    <path d="M520 8 L552 8 L546 30 L524 30 Z" fill="#f5f7f9"/>
    <!-- Horizontal stabilizer -->
    <path d="M500 66 L560 58 L562 68 L502 76 Z" fill="#dfe4e8"/>
    <!-- Landing gear -->
    <g fill="#2b333b">
      <rect x="250" y="150" width="9" height="42"/>
      <rect x="330" y="150" width="9" height="42"/>
      <rect x="480" y="146" width="8" height="34"/>
    </g>
    <g fill="#141a20">
      <circle cx="254" cy="196" r="16"/>
      <circle cx="334" cy="196" r="16"/>
      <circle cx="484" cy="184" r="12"/>
    </g>
  </g>

  <!-- Foreground contrast fade (keeps overlaid text readable) -->
  <rect y="820" width="1600" height="380" fill="url(#fade)"/>
</svg>
